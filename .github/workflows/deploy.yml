name: Build and deploy

on:
  push:
    branches:
      - main
      - claude/smart-bookmark-3d-site-8en9if
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smart-bookmark-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No lockfile is committed, so `npm install` rather than `npm ci`.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify the timeline
        run: npm run verify

      # ---- the hosted site -------------------------------------------------
      - name: Build for GitHub Pages
        run: npm run build
        env:
          VITE_BASE: /smart-bookmark/

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      # ---- the double-clickable single file --------------------------------
      - name: Build the standalone file
        run: npm run build:single

      - name: Report output
        run: |
          echo "--- dist ---"; ls -lh dist
          echo "--- standalone ---"; ls -lh dist-single/smart-bookmark.html

      # Downloadable from the run page: unzip and open, no tooling needed.
      - name: Upload the standalone file
        uses: actions/upload-artifact@v4
        with:
          name: smart-bookmark-standalone
          path: dist-single/smart-bookmark.html
          if-no-files-found: error

      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: smart-bookmark-site
          path: dist
          if-no-files-found: error

      # Publishing by pushing a branch rather than through the Pages
      # environment, because that environment is restricted to the default
      # branch by default and this work lives on a feature branch.
      - name: Publish to the gh-pages branch
        run: |
          cp dist-single/smart-bookmark.html dist/standalone.html
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published. Enable Pages once at Settings -> Pages -> Source: Deploy from a branch -> gh-pages / root."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
