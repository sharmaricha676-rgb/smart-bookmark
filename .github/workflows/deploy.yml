name: Build and deploy

on:
  push:
    branches:
      - main
      - claude/smart-bookmark-3d-site-8en9if
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Always runs. This is the real compile — if anything in the project is
  # broken, it fails here with a readable log.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify the timeline
        run: npm run verify

      - name: Build
        run: npm run build
        env:
          # Project pages are served from /<repo>/, so assets need that prefix.
          VITE_BASE: /smart-bookmark/

      - name: Report build output
        run: |
          echo "--- dist ---"
          ls -lhR dist
          echo "--- total ---"
          du -sh dist

      # A single-page app on Pages needs a 404 that serves the app shell,
      # otherwise a refresh on any deep link 404s.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Separate job so a Pages-not-enabled failure never hides the build result.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
